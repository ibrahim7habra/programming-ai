<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programming AI</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #334155; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; }
    .user { background: #2563eb; align-self: flex-start; }
    .bot { background: #1e293b; align-self: flex-end; border: 1px solid #334155; }
    form { display: flex; padding: 12px; background: #1e293b; gap: 8px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; outline: none; font-size: 16px; }
    button { padding: 12px 20px; background: #22c55e; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <header>Programming AI</header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="اسألني في البرمجة، الأخبار، أو أي حاجة..." required />
    <button type="submit">إرسال</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = `msg ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, "user");
      input.value = "";

      addMsg("جاري التفكير...", "bot");
      const loadingMsg = chat.lastChild;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        loadingMsg.textContent = data.reply || "لم أتمكن من جلب الرد.";
      } catch {
        loadingMsg.textContent = "تعذر الاتصال بالسيرفر.";
      }
    };
  </script>
</body>
</html>
